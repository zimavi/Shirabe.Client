name: Release

# Push a tag v<version> (it must equal version.txt) to build every package and publish a GitHub Release.
# "Run workflow" by hand builds everything and keeps the files as workflow artifacts, but publishes nothing.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          version=$(tr -d '[:space:]' < version.txt)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version.txt ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, bass: bass.dll, bassfx: bass_fx.dll }
          - { os: ubuntu-latest, rid: linux-x64, bass: libbass.so, bassfx: libbass_fx.so }
          - { os: macos-latest, rid: osx-arm64, bass: libbass.dylib, bassfx: libbass_fx.dylib }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # vpk must be the same version as the Velopack package the app is built with.
      - name: Install vpk
        run: |
          velopack=$(sed -n 's/.*Include="Velopack" Version="\([^"]*\)".*/\1/p' Directory.Packages.props)
          dotnet tool install -g vpk --version "$velopack"

      - name: Publish (self-contained)
        env: # the build puts them into the app, see Shirabe.Client.csproj
          LastFmApiKey: ${{ secrets.LASTFM_API_KEY }}
          LastFmApiSecret: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          # A release must not silently ship without Last.fm; a manual run (a fork, say) may.
          if [[ "$GITHUB_REF_TYPE" == tag && ( -z "$LastFmApiKey" || -z "$LastFmApiSecret" ) ]]; then
            echo "::error::The LASTFM_API_KEY or LASTFM_API_SECRET repository secret is missing"
            exit 1
          fi
          dotnet publish Shirabe.Client.Desktop/Shirabe.Client.Desktop.csproj -c Release -r ${{ matrix.rid }} \
            --self-contained -p:SourceRevisionId="${GITHUB_SHA::9}" -o publish
          # The build only warns when a BASS download fails; do not ship an app without its audio libraries.
          for library in "${{ matrix.bass }}" "${{ matrix.bassfx }}"; do
            test -f "publish/$library" || { echo "::error::$library is missing from the publish folder"; exit 1; }
          done

      # Setup.exe and .msi, plus the feed files (.nupkg, releases.win.json) that installed copies check for updates.
      - name: Pack (Windows)
        if: runner.os == 'Windows'
        run: |
          bash packaging/windows/license-rtf.sh "$RUNNER_TEMP/license.rtf"
          # The splash is what Setup.exe shows; the --msi* and --inst* options are the pages of the .msi.
          vpk pack --packId Shirabe --packVersion "$VERSION" --packTitle Shirabe --packAuthors zimavi \
            --packDir publish --mainExe Shirabe.exe --runtime win-x64 --icon Shirabe.Client/Assets/app.ico \
            --msi --noPortable --outputDir dist \
            --splashImage packaging/windows/splash.png --splashProgressColor "#E8456B" \
            --msiTopBanner packaging/windows/msi-banner.bmp --msiDialogBackground packaging/windows/msi-dialog.bmp \
            --instWelcome packaging/windows/welcome.txt --instLicense "$RUNNER_TEMP/license.rtf" \
            --instConclusion packaging/windows/conclusion.txt

          # vpk leaves the platform out of the Windows package name only (Linux gets -linux-full): add it, in the feed too.
          old="Shirabe-$VERSION-full.nupkg"
          new="Shirabe-$VERSION-win-full.nupkg"
          mv "dist/$old" "dist/$new"
          sed -i "s/\"$old\"/\"$new\"/" dist/releases.win.json
          grep -qF "\"$new\"" dist/releases.win.json || { echo "::error::releases.win.json does not name $new"; exit 1; }

      # .AppImage and its feed files with vpk; .tar.gz, .deb and .rpm from the same publish folder.
      - name: Pack (Linux)
        if: runner.os == 'Linux'
        run: |
          vpk pack --packId Shirabe --packVersion "$VERSION" --packTitle Shirabe --packAuthors zimavi \
            --packDir publish --mainExe Shirabe --runtime linux-x64 --icon Shirabe.Client/Assets/Icon.png \
            --categories "AudioVideo;Audio;Player" --outputDir dist

          find publish -name '*.pdb' -delete
          tar --owner=0 --group=0 --transform 's,^publish,Shirabe,' -czf "dist/Shirabe-$VERSION-linux-x64.tar.gz" publish

          nfpm=v2.49.0
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/$nfpm/nfpm_${nfpm#v}_Linux_x86_64.tar.gz" | tar -xz -C "$RUNNER_TEMP" nfpm
          for kind in deb rpm; do
            "$RUNNER_TEMP/nfpm" package --config packaging/linux/nfpm.yaml --packager $kind --target "dist/Shirabe-$VERSION-linux-x64.$kind"
          done
          # tree entries keep the file modes of the publish folder: the launcher must stay executable
          dpkg-deb -c "dist/Shirabe-$VERSION-linux-x64.deb" | grep -E '^-rwxr-xr-x .* \./opt/shirabe/Shirabe$'

      # The .app (inside vpk's portable zip) and its feed files with vpk; the .dmg is built here. No .pkg installer.
      - name: Pack (macOS)
        if: runner.os == 'macOS'
        run: |
          # "-" signs ad hoc (no Apple certificate): without a signature over the whole bundle, macOS calls a downloaded
          # copy "damaged". vpk signs before it makes the zip and the update package, with the entitlements .NET needs.
          vpk pack --packId Shirabe --packVersion "$VERSION" --packTitle Shirabe --packAuthors zimavi \
            --packDir publish --mainExe Shirabe --runtime osx-arm64 --icon packaging/macos/Shirabe.icns --noInst --outputDir dist \
            --signAppIdentity=-
          # vpk already puts the platform into this name, nothing to rename.
          test -f "dist/Shirabe-$VERSION-osx-full.nupkg" || { echo "::error::The macOS update package is missing"; exit 1; }

          mkdir dmg
          # ditto, not unzip: it keeps the symlinks and file modes inside the .app
          ditto -x -k dist/Shirabe-osx-Portable.zip dmg
          rm dist/Shirabe-osx-Portable.zip
          test -x dmg/Shirabe.app/Contents/MacOS/Shirabe

          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.7 ds_store==1.3.3 mac_alias==2.2.3
          "$RUNNER_TEMP/dmgbuild/bin/dmgbuild" -s packaging/macos/dmg.py -D app=dmg/Shirabe.app \
            Shirabe dist/Shirabe-osx-arm64.dmg

          # The signature, checked on the app as it comes out of the finished image.
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/mnt" dist/Shirabe-osx-arm64.dmg
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/mnt/Shirabe.app"
          hdiutil detach "$RUNNER_TEMP/mnt"

      # Velopack's update feed is .nupkg and releases.*.json. assets.*.json (for vpk upload) and RELEASES* (legacy,
      # still naming the Windows package without its platform) stay out.
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: |
            dist/*
            !dist/assets.*.json
            !dist/RELEASES*
          if-no-files-found: error

  release:
    needs: [ version, build ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      # Winget and Flathub need a hash for the installers and the tarball.
      - name: SHA256 of every file
        working-directory: dist
        run: |
          sha256sum * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          { echo '```'; cat SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # generate_release_notes: GitHub's changelog (merged PRs since the previous release); group it with .github/release.yml.
      - uses: softprops/action-gh-release@v3
        with:
          name: Shirabe ${{ env.VERSION }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(env.VERSION, '-') }}
