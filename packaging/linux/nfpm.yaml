# .deb and .rpm from the self-contained publish folder (nfpm: https://nfpm.goreleaser.com).
# Run from the repo root with VERSION set and the publish output in ./publish:
#   VERSION=$(cat version.txt) nfpm package --config packaging/linux/nfpm.yaml --packager deb --target dist/
name: shirabe
arch: amd64
platform: linux
version: ${VERSION}
version_schema: semver # 0.2.0-beta.1 becomes 0.2.0~beta.1, so a final release sorts after its betas
section: sound
priority: optional
maintainer: zimavi <https://github.com/zimavi>
description: |-
  Music player for the music you already have.
  Local library, lyrics, queue and rich metadata, with no account or server.
homepage: https://github.com/zimavi/Shirabe.Client
license: Apache-2.0

# The app is self-contained (it brings its own .NET runtime); from the system, Skia loads fontconfig, and secrets such
# as the Last.fm session are saved through libsecret (named by its file in the rpm, package names differ by distro).
overrides:
  deb:
    depends: [ libfontconfig1, libsecret-1-0 ]
  rpm:
    depends: [ fontconfig, "libsecret-1.so.0()(64bit)" ]

contents:
  - src: publish/
    dst: /opt/shirabe
    type: tree
  - src: /opt/shirabe/Shirabe
    dst: /usr/bin/shirabe
    type: symlink
  - src: packaging/linux/shirabe.desktop
    dst: /usr/share/applications/shirabe.desktop
  - src: packaging/linux/icons/48.png
    dst: /usr/share/icons/hicolor/48x48/apps/shirabe.png
  - src: packaging/linux/icons/128.png
    dst: /usr/share/icons/hicolor/128x128/apps/shirabe.png
  - src: packaging/linux/icons/256.png
    dst: /usr/share/icons/hicolor/256x256/apps/shirabe.png
  - src: packaging/linux/icons/512.png
    dst: /usr/share/icons/hicolor/512x512/apps/shirabe.png
  - src: packaging/art/shirabe.svg
    dst: /usr/share/icons/hicolor/scalable/apps/shirabe.svg
